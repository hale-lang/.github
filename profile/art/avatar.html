<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Source for profile/art/avatar.png, the hale-lang organization's avatar.
  GitHub takes it as a manual upload: Organization settings, Profile,
  Profile picture.

  One lotus: the flower every node of hale-lang.org's lotus field is drawn
  as (drawLotus in src/lib/lotus-field.ts), with five, three and three
  petals in the site's dark palette around a gold core. The small bowl the
  field draws under each node is left out, and the lines are heavier, so
  the flower stays clean at avatar sizes.

  Regenerate after editing, with any headless Chromium:
    chrome-headless-shell --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=512,512 --screenshot=profile/art/avatar.png \
      "file://$PWD/profile/art/avatar.html"
-->
<style>
  :root {
    --paper: #131015;
    --lotus-petal: #ff8fa5; --lotus-petal-2: #b39bff; --lotus-core: #ffd28a;
    --wash-1: rgba(255, 143, 165, 0.14); --wash-2: rgba(255, 210, 138, 0.08);
  }
  * { margin: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    background:
      radial-gradient(55% 55% at 50% 48%, var(--wash-1), transparent 75%),
      radial-gradient(45% 45% at 50% 90%, var(--wash-2), transparent 70%),
      var(--paper);
  }
  canvas { width: 512px; height: 512px; display: block; }
</style>
</head>
<body>
<canvas></canvas>
<script>
(function () {
  var S = 512, k = 2, R = 40, STROKE = 2.1, PETALS = 5, FILL = 0.8, TAU = Math.PI * 2;
  var canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
  canvas.width = S * k; canvas.height = S * k;
  var cs = getComputedStyle(document.documentElement), v = function (n) { return cs.getPropertyValue(n).trim(); };
  var rose = v('--lotus-petal'), violet = v('--lotus-petal-2'), gold = v('--lotus-core');
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function alpha(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
  // the field's petal outline (petal() in lotus-field.ts)
  function petal(r, w) {
    ctx.beginPath(); ctx.moveTo(0, r * 0.23);
    ctx.bezierCurveTo(-w * 0.72, -r * 0.03, -w * 0.54, -r * 0.70, 0, -r);
    ctx.bezierCurveTo(w * 0.54, -r * 0.70, w * 0.72, -r * 0.03, 0, r * 0.23);
  }
  // fit the flower (petal tips at -R, bases at +0.23R, about 2.1R wide) to the square, centred
  var f = S * FILL / (R * 2.1);
  ctx.setTransform(k * f, 0, 0, k * f, k * S / 2, k * (S / 2 + R * 0.385 * f));
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // drawLotus's three layers, still and at full depth: rose, rose, violet
  for (var L = 0; L < 3; L++) {
    var count = Math.max(3, PETALS - L * 2), lr = R * (1 - L * 0.25), w = lr * (0.55 - L * 0.05);
    ctx.lineWidth = clamp(R * (0.045 - L * 0.006), 0.6, 1.4) * STROKE;
    ctx.strokeStyle = alpha(L === 2 ? violet : rose, L === 0 ? 0.7 : 0.5);
    for (var i = 0; i < count; i++) {
      ctx.save(); ctx.rotate((i / (count - 1) - 0.5) * Math.PI * 0.84); petal(lr, w); ctx.stroke(); ctx.restore();
    }
  }
  ctx.fillStyle = alpha(gold, 0.85); ctx.beginPath(); ctx.arc(0, R * 0.1, clamp(R * 0.16, 1.8, 4.5), 0, TAU); ctx.fill();
})();
</script>
</body>
</html>
